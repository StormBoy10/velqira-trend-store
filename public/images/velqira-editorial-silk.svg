<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADCD0"/>
      <stop offset="25%" stop-color="#F7EFE8"/>
      <stop offset="50%" stop-color="#D0B8A5"/>
      <stop offset="75%" stop-color="#EAE0D6"/>
      <stop offset="100%" stop-color="#BFA590"/>
    </linearGradient>
    <linearGradient id="wave1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#C2A893" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8DBD0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89E88" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#F3E7DC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9E836D" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Champagne Gold Satin Base -->
  <rect width="800" height="600" fill="url(#silkBase)"/>

  <!-- Curved Silk Drapes -->
  <path d="M-50 -50 Q 300 250 850 50 L 850 -50 Z" fill="url(#wave1)"/>
  <path d="M-100 200 C 250 50, 450 450, 900 180 L 900 650 L -100 650 Z" fill="url(#wave1)"/>
  <path d="M-100 380 C 320 280, 520 580, 900 320 L 900 650 L -100 650 Z" fill="url(#wave2)"/>

  <!-- Centered Star Emblem -->
  <g transform="translate(400, 240)">
    <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="#332522"/>
  </g>

  <!-- Official VELQIRA Serif Typography -->
  <text x="400" y="320" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="68" font-weight="700" fill="#332522" text-anchor="middle" letter-spacing="10">VELQIRA</text>
</svg>
